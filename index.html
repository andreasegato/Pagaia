<title>Pagaia – Canoa velocità</title>
<style>
:root{--bg:#F2F2F7;--card:#fff;--card2:#F7F7FA;--text:#0b0b0f;--sec:#6e6e73;--ter:#aeaeb2;--sep:rgba(60,60,67,.14);--acc:#00A39A;--acc2:#00C2B2;--accs:rgba(0,163,154,.12);--blue:#0A84FF;--green:#28A745;--orange:#F08A00;--red:#E5342B;--glass:rgba(255,255,255,.6);--glassb:rgba(255,255,255,.75);--sh:0 1px 2px rgba(0,0,0,.04),0 6px 20px rgba(0,0,0,.05)}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html{height:100%;overflow:hidden;overscroll-behavior:none}
body{position:fixed;left:0;right:0;top:0;width:100%;height:var(--app-h,100%);}
#view{position:absolute;inset:0;overflow:hidden}
html,body{background:var(--bg);color:var(--text);font:16px/1.3 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea,select{font:inherit;color:var(--text)}
.scroll{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:calc(env(safe-area-inset-top) + 10px) 16px calc(env(safe-area-inset-bottom) + 100px)}
.hdr{display:flex;align-items:center;justify-content:space-between;margin:6px 2px 14px;gap:10px}
.hdr>div{min-width:0}.hdr h1.hh{font-size:27px;overflow:hidden;text-overflow:ellipsis}.hdr h1{font-size:32px;font-weight:800;letter-spacing:-.6px;white-space:nowrap}
.hdr .sm{font-size:13px;color:var(--sec);font-weight:500}
.ver{font-size:10px;color:var(--ter);font-weight:500;margin-left:6px;vertical-align:middle;letter-spacing:0}
.gbtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--glass);backdrop-filter:blur(18px) saturate(180%);-webkit-backdrop-filter:blur(18px) saturate(180%);border:.5px solid var(--glassb);box-shadow:var(--sh),inset 0 1px 0 rgba(255,255,255,.35);font-size:24px;font-weight:400;color:var(--acc);flex:none}
.gbtn svg{width:20px;height:20px}
.card{background:var(--card);border-radius:22px;padding:16px;margin-bottom:12px;box-shadow:var(--sh)}
.card h3{font-size:13px;font-weight:600;color:var(--sec);text-transform:uppercase;letter-spacing:.3px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.sec{font-size:20px;font-weight:700;margin:20px 4px 10px;letter-spacing:-.3px;display:flex;justify-content:space-between;align-items:baseline}
.sec a{font-size:15px;font-weight:500;color:var(--acc)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px}
.tile{background:var(--card);border-radius:20px;padding:13px 14px;box-shadow:var(--sh);text-align:left;min-width:0;position:relative}
.tile .l{font-size:12.5px;color:var(--sec);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .v{font-size:26px;font-weight:700;letter-spacing:-.5px;margin-top:3px;white-space:nowrap;font-variant-numeric:tabular-nums}
.tile .v small{font-size:14px;font-weight:600;color:var(--sec);margin-left:2px}
.tile .s{font-size:12px;color:var(--sec);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grid3 .tile .v{font-size:21px}
.tile:active,.row:active,.chip:active,.tipc:active{transform:scale(.98);opacity:.85}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:1px}
.up{color:var(--green)}.down{color:var(--red)}.flat{color:var(--sec)}
.seg{display:flex;background:rgba(118,118,128,.14);border-radius:12px;padding:2px;margin-bottom:12px}
.seg button{flex:1;padding:7px 4px;border-radius:10px;font-size:14px;font-weight:600;color:var(--text);white-space:nowrap}
.seg button.on{background:var(--card);box-shadow:0 2px 6px rgba(0,0,0,.12)}
@media (prefers-color-scheme:dark){.seg button.on{background:#636366}}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px}
.chip{padding:8px 13px;border-radius:999px;background:rgba(118,118,128,.13);font-size:14.5px;font-weight:600;white-space:nowrap}
.chip.on{background:var(--acc);color:#fff}
.list{background:var(--card);border-radius:20px;overflow:hidden;margin-bottom:12px;box-shadow:var(--sh)}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;width:100%;text-align:left;position:relative}
.row+.row:before{content:"";position:absolute;top:0;left:58px;right:0;height:.5px;background:var(--sep)}
.ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:18px;flex:none;background:var(--accs)}
.row .m{flex:1;min-width:0}
.row .t{font-weight:600;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .st{font-size:13px;color:var(--sec);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.row .r{text-align:right;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.row .r small{display:block;font-size:12px;color:var(--sec);font-weight:500}
.chev{color:var(--ter);font-size:20px;margin-left:2px}
.empty{text-align:center;color:var(--sec);padding:26px 16px;font-size:15px}
.btn{display:block;width:100%;padding:15px;border-radius:16px;background:var(--acc);color:#fff;font-weight:700;font-size:17px;text-align:center;margin:8px 0}
.btn.sec2{background:rgba(118,118,128,.14);color:var(--acc)}
.btn.del{background:rgba(229,52,43,.12);color:var(--red)}
.tabbar{position:absolute;left:14px;right:14px;bottom:max(10px,env(safe-area-inset-bottom));height:64px;border-radius:32px;display:flex;z-index:100;background:var(--glass);backdrop-filter:blur(22px) saturate(190%);-webkit-backdrop-filter:blur(22px) saturate(190%);border:.5px solid var(--glassb);box-shadow:0 8px 30px rgba(0,0,0,.12),inset 0 1px 0 rgba(255,255,255,.4);padding:4px}

.page{position:absolute;inset:0;background:var(--bg);z-index:50;transform:translateX(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1);will-change:transform;box-shadow:-10px 0 30px rgba(0,0,0,.08)}

.ph .act{min-width:38px;height:38px;padding:0 14px;border-radius:19px;background:var(--acc);color:#fff;font-weight:700;font-size:15px}
.ph .sp{width:38px}
.big{font-size:44px;font-weight:800;letter-spacing:-1px;font-variant-numeric:tabular-nums}
.big small{font-size:20px;color:var(--sec);font-weight:600;margin-left:4px}
.trend{display:inline-flex;align-items:center;gap:4px;font-size:13.5px;font-weight:700;padding:4px 10px;border-radius:999px;background:rgba(118,118,128,.12)}
.trend.up{background:rgba(40,167,69,.13)}.trend.down{background:rgba(229,52,43,.12)}
.how{font-size:14.5px;line-height:1.45;color:var(--text)}
.how b{font-weight:700}
.how p+p{margin-top:8px}
.chart{position:relative;margin:4px -4px 0;touch-action:pan-y}
.chart svg{display:block;overflow:visible}
.chart .ax{font-size:10.5px;fill:var(--sec);font-variant-numeric:tabular-nums}
.chart .gl{stroke:var(--sep);stroke-width:1}

.chart .pt{fill:var(--card);stroke:var(--acc);stroke-width:2.2}
.chart .pt.sel,.chart .bar.sel{filter:brightness(1.15)}
.chart .bar{fill:var(--acc)}
.cexp{position:absolute;top:-6px;right:0;width:30px;height:30px;border-radius:50%;background:rgba(118,118,128,.13);font-size:15px;color:var(--sec)}
.ctip{position:absolute;top:-4px;pointer-events:none;background:var(--text);color:var(--bg);font-size:12.5px;font-weight:600;padding:5px 9px;border-radius:9px;white-space:nowrap;opacity:0;transition:opacity .15s;transform:translateX(-50%);z-index:3}
.ctip.on{opacity:1}
.empty-c{height:120px;display:grid;place-items:center;color:var(--sec);font-size:14px}
.zwrap{overflow-x:auto;overflow-y:hidden;touch-action:pan-x;padding:30px 8px 8px;background:var(--card);border-radius:22px}
.field{margin-bottom:14px}
.field>label{display:block;font-size:13px;color:var(--sec);font-weight:600;margin:0 4px 6px;text-transform:uppercase;letter-spacing:.3px}
.inp{position:relative;background:var(--card);border-radius:14px;box-shadow:var(--sh)}
.inp input,.inp textarea{width:100%;border:0;outline:0;background:transparent;padding:13px 40px 13px 14px;font-size:17px;border-radius:14px;-webkit-appearance:none;appearance:none}
.inp textarea{min-height:84px;resize:none;line-height:1.35}
.inp input[type=date]{padding-right:14px;min-height:48px}
.clr{position:absolute;right:8px;top:12px;width:24px;height:24px;border-radius:50%;background:rgba(118,118,128,.28);color:var(--card);font-size:16px;line-height:24px;font-weight:700;display:grid;place-items:center}
.inp input:placeholder-shown+.clr,.inp textarea:placeholder-shown+.clr{display:none}
.hint{font-size:12.5px;color:var(--sec);margin:6px 4px 0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.setbox{background:var(--card2);border-radius:18px;padding:12px;margin-bottom:10px;border:.5px solid var(--sep)}
.setbox .hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-weight:700}
.setbox .inp{box-shadow:none;background:var(--card)}
.rng{width:100%;-webkit-appearance:none;appearance:none;height:30px;background:transparent}
.rng::-webkit-slider-runnable-track{height:8px;border-radius:4px;background:linear-gradient(90deg,#28A745,#F0C000,#F08A00,#E5342B)}
.rng::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.3);margin-top:-10px}
.moods{display:flex;justify-content:space-between;background:var(--card);border-radius:16px;padding:6px;box-shadow:var(--sh)}
.moods button{font-size:28px;width:52px;height:48px;border-radius:12px;opacity:.4}
.moods button.on{opacity:1;background:var(--accs)}
.ring{position:relative;width:118px;height:118px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .c b{font-size:28px;font-weight:800;letter-spacing:-.5px}
.ring .c span{font-size:12px;color:var(--sec);font-weight:600}
.hero{display:flex;gap:16px;align-items:center}
.tipc{display:flex;gap:12px;align-items:flex-start;padding:12px 0;text-align:left;width:100%}
.tipc+.tipc{border-top:.5px solid var(--sep)}
.tipc .e{font-size:22px;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none}
.tipc .t{font-weight:700;font-size:15.5px}
.tipc .x{font-size:14px;color:var(--sec);margin-top:2px;line-height:1.38}
.lv-good .e{background:rgba(40,167,69,.14)}.lv-warn .e{background:rgba(240,138,0,.16)}.lv-bad .e{background:rgba(229,52,43,.14)}.lv-info .e{background:var(--accs)}
.race{background:linear-gradient(135deg,#00A39A,#0A6E8A);color:#fff;border-radius:22px;padding:16px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;box-shadow:0 8px 24px rgba(0,120,130,.25)}
.race .n{font-size:13px;font-weight:600;opacity:.85}
.race .t{font-size:20px;font-weight:800;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:56vw}
.race .s{font-size:13px;opacity:.85;margin-top:2px}
.race .d{text-align:center}
.race .d b{font-size:38px;font-weight:800;display:block;line-height:1}
.race .d span{font-size:12px;font-weight:600;opacity:.85}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.cal .h{font-size:11.5px;color:var(--sec);font-weight:600;padding:4px 0}
.cal button{aspect-ratio:1;border-radius:50%;font-size:16px;font-weight:500;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.cal button.o{color:var(--ter)}
.cal button.td{color:var(--acc);font-weight:800}
.cal button.sel{background:var(--acc);color:#fff}
.cal button .ds{display:flex;gap:2px;position:absolute;bottom:4px}
.cal button .ds i{width:5px;height:5px;border-radius:50%;background:var(--acc)}
.cal button .ds i.g{background:var(--red)}
.cal button.sel .ds i{background:#fff}
.calh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.calh b{font-size:18px;font-weight:700;text-transform:capitalize}
.calh button{width:36px;height:36px;border-radius:50%;color:var(--acc);font-size:22px;background:var(--accs)}
.stack{height:14px;border-radius:7px;overflow:hidden;display:flex;background:rgba(118,118,128,.14);margin:8px 0}
.stack i{display:block;height:100%}
.leg{display:flex;gap:12px;font-size:12.5px;color:var(--sec);font-weight:600;flex-wrap:wrap}
.tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:14.5px}
.tbl td,.tbl th{padding:8px 4px;text-align:right;border-bottom:.5px solid var(--sep);white-space:nowrap}
.tbl th{font-size:12px;color:var(--sec);font-weight:600}
.tbl td:first-child,.tbl th:first-child{text-align:left}
.tbl tr:last-child td{border-bottom:0}
.best{color:var(--green);font-weight:700}
.av img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
.av{width:72px;height:72px;border-radius:50%;background:linear-gradient(135deg,#00C2B2,#0A6E8A);color:#fff;display:grid;place-items:center;font-size:28px;font-weight:800;flex:none}
.warnc{background:rgba(240,138,0,.12)}.badc{background:rgba(229,52,43,.13)}.infoc{background:var(--accs)}.warnc .x,.badc .x,.infoc .x{font-size:14px;color:var(--text);margin-top:4px;line-height:1.38}.effb{height:5px;border-radius:3px;background:rgba(118,118,128,.14);margin-top:6px;overflow:hidden}.effb i{display:block;height:100%;background:var(--acc);border-radius:3px}
.balr{display:flex;align-items:center;gap:8px;width:100%;padding:6px 0;text-align:left}.balr .bl{width:118px;font-size:13.5px;font-weight:600;white-space:nowrap}.balr .bb{flex:1;height:10px;border-radius:5px;background:rgba(118,118,128,.14);position:relative}.balr .bb i{display:block;height:100%;border-radius:5px}.balr .bb b{position:absolute;top:-3px;width:2px;height:16px;background:var(--text);opacity:.5}.balr .bv{width:40px;text-align:right;font-weight:700;font-size:13.5px;font-variant-numeric:tabular-nums}
.toast{position:absolute;left:50%;top:calc(env(safe-area-inset-top) + 12px);transform:translate(-50%,-80px);background:var(--glass);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);border:.5px solid var(--glassb);padding:10px 18px;border-radius:22px;font-weight:600;font-size:15px;z-index:300;transition:transform .3s;box-shadow:0 8px 30px rgba(0,0,0,.15);white-space:nowrap}
.toast.on{transform:translate(-50%,0)}
.pr{display:flex;gap:10px;align-items:flex-start;padding:12px 0}
.pr+.pr{border-top:.5px solid var(--sep)}
.pr .n{width:30px;height:30px;border-radius:50%;background:var(--accs);color:var(--acc);font-weight:800;display:grid;place-items:center;flex:none;font-size:14px}
.pr b{display:block;font-size:15.5px;margin-bottom:2px}
.pr span{font-size:14px;color:var(--sec);line-height:1.4}
textarea.bk{width:100%;min-height:110px;border-radius:14px;border:.5px solid var(--sep);background:var(--card);padding:10px;font-size:12px;font-family:ui-monospace,monospace}
</style>

<script>
'use strict';
const VER='1.9';
const KEY='pagaia_francesco_v1';
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const DAY=864e5;
const pad2=n=>String(n).padStart(2,'0');
const isoOf=d=>d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
const toD=s=>new Date(s+'T12:00:00');
const today=()=>isoOf(new Date());
const MESI=['gen','feb','mar','apr','mag','giu','lug','ago','set','ott','nov','dic'];
const MESIL=['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre'];
const GG=['dom','lun','mar','mer','gio','ven','sab'];
const fD=s=>{const d=toD(s);return d.getDate()+' '+MESI[d.getMonth()]};
const fDL=s=>{const d=toD(s);return GG[d.getDay()]+' '+d.getDate()+' '+MESI[d.getMonth()]+(d.getFullYear()!==new Date().getFullYear()?' '+d.getFullYear():'')};
const fN=(x,dec=0)=>x==null||isNaN(x)?'—':Number(x).toLocaleString('it-IT',{maximumFractionDigits:dec,minimumFractionDigits:0});
const fN1=x=>fN(x,1);
const fF=(x,d)=>x==null||isNaN(x)?'—':Number(x).toLocaleString('it-IT',{maximumFractionDigits:d,minimumFractionDigits:d});
function parseT(v){if(v==null)return null;let s=String(v).trim().replace(/[’'′]/g,':').replace(/["″]/g,'.').replace(/,/g,'.');if(!s)return null;

function raceTips(dist){const c=calc(),out=[];const ds=dist?[dist]:[...new Set(c.R.map(r=>r.dist))];
 ds.forEach(D=>{const a=resFor(D,'all').filter(r=>r.split);const l=a.slice(-3);if(l.length){const d=mean(l.map(r=>{const h1=r.split,h2=r.t-r.split;return (h2-h1)/h1*100}));const thr=D<=200?10:D<=500?7:5;
  if(d>thr)out.push({lv:'warn',ic:'🔋',t:`${D} m: cali nel finale`,x:`Nella seconda metà vai in media ${fN1(d)}% più lento della prima. Allena la resistenza alla velocità: ripetute di 250-300 m a ritmo gara con recupero lungo, e parti un filo più controllato.`,k:'race:'+D});
  else if(d<0)out.push({lv:'info',ic:'🚀',t:`${D} m: puoi partire più forte`,x:'Chiudi più veloce di come parti: hai energia da spendere prima. Allena le partenze: 5-8 partenze da fermo di 10-15 colpi a tutta, recupero completo.',k:'race:'+D});
  else out.push({lv:'good',ic:'✅',t:`${D} m: ritmo ben distribuito`,x:`Tra prima e seconda metà perdi solo ${fN1(d)}%: è una gestione da atleta esperto. Per scendere di tempo lavora su velocità massima e tecnica.`,k:'race:'+D})}});
 const p2=pb(200,'K1')||pb(200),p5=pb(500,'K1')||pb(500);
 if((!dist||dist===200||dist===500)&&p2&&p5){const r=(500/p5.t)/(200/p2.t);
  if(r<.86)out.push({lv:'info',ic:'🫁',t:'Punta sulla resistenza',x:`Sui 500 tieni il ${fN(r*100)}% della velocità dei 200: la base aerobica è il tuo margine più grande. Più uscite lunghe facili (fondo) e ripetute di 2-4 minuti a ritmo medio.`,k:'race:500'});
  else if(r>.93)out.push({lv:'info',ic:'⚡',t:'Punta sulla velocità',x:`Sui 500 tieni il ${fN(r*100)}% della velocità dei 200: resistenza ottima. Il margine è nella velocità pura: scatti di 8-15 secondi a tutta, partenze e frequenza di colpata.`,k:'race:200'});
  else out.push({lv:'good',ic:'⚖️',t:'Velocità e resistenza in equilibrio',x:`Sui 500 tieni il ${fN(r*100)}% della velocità dei 200, un buon equilibrio. Continua a curare entrambe, con la tecnica sempre al primo posto.`,k:'race:500'})}
 return out}

function DET(k){const c=calc(),P=S.profile;const [b,arg,BT]=k.split(':');const D=+arg;
 const W=(t,f,unit,how,o={})=>Object.assign({title:t,series:p=>seriesWeeks(p,f),bar:true,unit,how},o);
 switch(b){
 case 'kmw':return W('Km in canoa','km','km',`<p><b>Come si calcola:</b> somma dei km di tutte le uscite in canoa, settimana per settimana (da lunedì a domenica).</p><p><b>Perché conta:</b> il volume costruisce la base aerobica, il “motore” che serve anche nei 200 m. Aumenta poco alla volta: <b>massimo +10-15% a settimana</b>, e ogni 3-4 settimane una settimana più leggera.</p><p>La linea arancione è il tuo obiettivo (si cambia dal profilo ✏️).</p>`,{big:fN1(c.wk.km),bu:'km',sub:'questa settimana',goal:+P.kmGoal||0});
 case 'kmm':{const T=today();return{title:'Km al mese',big:fN1(c.sumR(T.slice(0,8)+'01',T,x=>x.tipo==='canoa'?+x.km||0:0)),bu:'km',sub:'questo mese',bar:true,unit:'km',series:p=>monthSeries(p,x=>x.tipo==='canoa'?+x.km||0:0),how:'<p><b>Come si calcola:</b> somma dei km in canoa di ogni mese.</p><p>Guarda la tendenza su più mesi: in inverno si costruisce la base (più km facili), in stagione di gare i km calano un po’ e cresce l’intensità.</p>'}}
 case 'kmy':{const T=today();return{title:'Km nell’anno',big:fN1(c.sumR(T.slice(0,5)+'01-01',T,x=>x.tipo==='canoa'?+x.km||0:0)),bu:'km',sub:'dal 1° gennaio',bar:true,unit:'km',series:p=>monthSeries(p==='1m'||p==='3m'?'1a':p,x=>x.tipo==='canoa'?+x.km||0:0),how:'<p><b>Come si calcola:</b> somma di tutti i km in canoa dal 1° gennaio. Il grafico mostra i km di ogni mese.</p>'}}
 case 'sessw':return W('Allenamenti','n','',`<p><b>Come si calcola:</b> numero di allenamenti (canoa, palestra, altro) per settimana.</p><p><b>Consiglio:</b> la costanza batte tutto. Meglio 4 allenamenti ogni settimana che 7 una settimana e 1 quella dopo. Almeno <b>1 giorno di riposo completo</b> a settimana.</p>`,{big:c.wk.n,sub:'questa settimana'});
 case 'minw':return W('Tempo di allenamento','min','min','<p><b>Come si calcola:</b> somma dei minuti di tutti gli allenamenti della settimana.</p><p>Insieme alla fatica (RPE) serve a calcolare il <b>carico</b>.</p>',{big:fN(c.wk.min),bu:'min',sub:'questa settimana'});
 case 'load':return W('Carico','load','',`<p><b>Come si calcola:</b> per ogni allenamento <b>minuti × fatica (RPE 1-10)</b>, poi la somma della settimana. È il metodo “session-RPE” usato da allenatori di tutto il mondo.</p><p>Esempio: 60 minuti a fatica 4 = 240; 30 minuti a fatica 8 = 240. Stesso carico, allenamenti diversi.</p>`,{big:fN(c.wk.load),sub:'questa settimana'});
 case 'acwr':return{title:'Rapporto carico',big:c.acwr==null?'—':fF(c.acwr,2),sub:c.acwr==null?'servono almeno 2 settimane di dati':'ultimi 7 giorni ÷ media 4 settimane',bar:false,zero:true,unit:'',fy:v=>fN(v,1),ft:v=>fF(v,2),series:p=>seriesWeeks(p,(w,k)=>{const e=addDays(k,6)>today()?today():addDays(k,6);return c.acwrAt(e)}),goal:1.3,goalLab:'limite 1,3',
  how:`<p><b>Come si calcola:</b> carico degli ultimi 7 giorni diviso per il carico medio settimanale delle ultime 4 settimane (carico = minuti × fatica).</p><p><span class="dot" style="background:var(--green)"></span><b>0,8 – 1,3</b> zona ideale: migliori senza rischi.<br><span class="dot" style="background:var(--orange)"></span><b>1,3 – 1,5</b> attenzione.<br><span class="dot" style="background:var(--red)"></span><b>sopra 1,5</b> aumento troppo brusco, più rischio di infortuni e stanchezza.<br><span class="dot" style="background:var(--orange)"></span><b>sotto 0,8</b> stai scaricando (va bene prima delle gare).</p>`};
 case 'easy':return{title:'Distribuzione intensità',big:c.i28.easyPct==null?'—':fN(c.i28.easyPct),bu:'%',sub:'tempo facile, ultimi 28 giorni',bar:false,zero:true,unit:'%',fy:v=>fN(v),series:p=>seriesWeeks(p,w=>w&&(w.easy+w.med+w.hard)?w.easy/(w.easy+w.med+w.hard)*100:null),goal:80,goalLab:'80%',
  how:`<p><b>Come si calcola:</b> minuti con fatica 1-4 (facile) diviso tutti i minuti segnati, nelle ultime 4 settimane.</p><p><b>Il principio 80/20:</b> gli studi sugli atleti di resistenza più forti (canoa, canottaggio, sci di fondo) mostrano che fanno circa l’<b>80% del tempo facile</b> e il <b>20% duro</b>. Il facile costruisce il motore, il duro lo rende veloce. Troppo “medio” stanca senza far migliorare.</p>`};
 case 'streak':return W('Serie di costanza','n','',`<p><b>Come si calcola:</b> settimane di fila con almeno <b>3 allenamenti</b>. Il grafico mostra gli allenamenti di ogni settimana.</p><p>I campioni non sono quelli che fanno l’allenamento più duro, ma quelli che si allenano bene per anni.</p>`,{big:c.streak,bu:'sett.',sub:'di fila con 3+ allenamenti',goal:3,goalLab:'3 a settimana'});
 case 'mood':return{title:'Sensazioni',big:c.moodRecent==null?'—':fN1(c.moodRecent),bu:'/5',sub:'media ultimi 5 allenamenti',bar:false,unit:'/5',fy:v=>fN(v,1),series:p=>c.ss.filter(x=>x.mood&&inPer(x.d,p)).reverse().map(x=>({x:toD(x.d).getTime(),y:+x.mood,lab:fD(x.d),tl:fD(x.d),note:MOOD[x.mood-1]})),
  how:'<p><b>Come si calcola:</b> media del voto “come ti sentivi” (da 😫 a 😄) degli ultimi allenamenti.</p><p>Se scende per più giorni di fila è un segnale di stanchezza: più sonno (9-11 ore a 12 anni), più cibo dopo l’allenamento, un giorno di riposo, e parlane con l’allenatrice.</p>'};
 case 'gym':return W('Palestra','gym','',`<p><b>Come si calcola:</b> allenamenti di palestra per settimana.</p><p><b>A 12 anni:</b> corpo libero, core (plank, ponte, addominali), mobilità di spalle e anche, trazioni assistite, piegamenti, elastici. Esercizi fatti bene, con controllo. I carichi pesanti arriveranno più avanti, quando sarai cresciuto.</p>`,{big:c.wk.gym,sub:'questa settimana',goal:2,goalLab:'2 a settimana'});
 case 'sprints':return W('Scatti','sc','',`<p><b>Come si calcola:</b> numero di ripetute cronometrate segnate negli allenamenti.</p><p><b>Per la velocità:</b> scatti brevi (8-15 secondi) a tutta, con <b>recupero completo</b> (1-2 minuti o più). Se i tempi peggiorano molto da uno scatto all’altro, il recupero è troppo corto: stai allenando la fatica, non la velocità.</p>`,{big:c.wk.sc,sub:'questa settimana'});
 case 'sprint':{const a=(c.SP[D]||[]).slice().reverse();const b=a.length?a.reduce((m,r)=>r.best<m.best?r:m):null;return{title:'Scatti '+D+' m',big:fT(b&&b.best),sub:b?'record il '+fD(b.d)+' · '+fN1(b.kmh)+' km/h':'',bar:false,lower:true,unit:'',fy:fTs,ft:fT,series:p=>a.filter(r=>inPer(r.d,p)).map(r=>({x:toD(r.d).getTime(),y:r.best,lab:fD(r.d),tl:fD(r.d),note:'media '+fT(r.avg)})),
  how:`<p><b>Come si calcola:</b> per ogni allenamento il tempo migliore sui ${D} m. Sotto vedi media, calo tra il migliore e il peggiore e i metri per colpata.</p><p><b>Metri per colpata</b> = metri percorsi a ogni colpo di pagaia. Se sale a parità di frequenza, la tua tecnica sta migliorando: è il dato che i grandi allenatori guardano di più.</p>`,

 case 'race':case 'ravg':case 'rpos':{const bt=BT||(resFor(D,'K1').length?'K1':((resFor(D,'all')[0]||{}).barca||'K1'));const a=resFor(D,bt);const p=pb(D,bt);const goal=bt==='K1'?parseT((P.goals||{})[D]):null;const DL=bt+' '+dLab(D);
  if(b==='rpos'){const q=a.filter(r=>r.pos);return{title:'Posizioni '+DL,big:q.length?fN1(mean(q.map(r=>r.pos))):'—',bu:'°',sub:'posizione media',bar:false,lower:true,fy:v=>fN(v),ft:v=>fN(v)+'°',series:pp=>q.filter(r=>inPer(r.d,pp)).map(r=>({x:toD(r.d).getTime(),y:r.pos,lab:fD(r.d),tl:r.race.nome,note:r.turno})),how:'<p><b>Come si calcola:</b> media dei piazzamenti in '+DL+'. Più basso è meglio.</p><p>La posizione dipende anche dagli avversari: per vedere i tuoi progressi conta di più il <b>tempo</b>.</p>'}}
  const avg=mean(a.map(r=>r.t));return{title:(b==='ravg'?'Media ':'Tempi ')+DL,big:fT(b==='ravg'?avg:p&&p.t),sub:b==='ravg'?'media di '+a.length+' gare':(p?'record: '+esc(p.race.nome)+', '+fD(p.d):''),bar:false,lower:true,fy:fTs,ft:fT,goal,goalLab:'obiettivo',series:pp=>a.filter(r=>inPer(r.d,pp)).map(r=>({x:toD(r.d).getTime(),y:r.t,lab:fD(r.d),tl:r.race.nome,note:[r.turno,r.con,r.cond].filter(Boolean).join(' · ')})),
   how:`<p><b>Come si calcola:</b> ogni punto è un tuo tempo in ${DL}. In barche diverse (K1, K2, K4) i tempi non si confrontano: ognuna ha i suoi grafici e record. ${b==='ravg'?'La media è la somma dei tempi diviso il numero di gare.':'Il record è il tempo più basso.'} Media delle ultime 5: <b>${fT(mean(a.slice(-5).map(r=>r.t)))}</b>.</p><p>Attenzione al <b>vento e alla corrente</b>: possono cambiare il tempo di vari secondi. Per questo li puoi segnare per ogni gara.</p>`,
   extra:(()=>{const t=raceTips(D);return t.length?`<div class="sec">Dove concentrarsi</div><div class="card" style="padding:4px 16px">${tipsHTML(t).replace(/data-k="[^"]*"/g,'')}</div>`:''})()}}

function principles(){const P=[['Prima la tecnica, poi la forza','Una colpata efficace (presa lontana in avanti, rotazione del busto, spinta con le gambe, uscita all’altezza dell’anca) vale più di muscoli grandi. Ogni allenamento dedica qualche minuto alla tecnica. Il dato da guardare: i metri per colpata.'],['80% facile, 20% duro','Il modello “polarizzato” usato dai migliori atleti di resistenza: la maggior parte dei km a ritmo in cui riesci a parlare, poche sedute davvero intense. Il medio-duro tutti i giorni stanca senza far migliorare.'],['Velocità = scatti brevi e recupero lungo','Per diventare veloce: scatti di 8-15 secondi a tutta, partenze da fermo, recupero completo. Se i tempi calano molto, fermati: stai allenando la fatica.'],['Crescere poco alla volta','Km e carico aumentano al massimo del 10-15% a settimana, con una settimana più leggera ogni 3-4. Il rapporto carico (0,8-1,3) ti dice se stai esagerando.'],['A 12 anni si costruisce l’atleta','Secondo i modelli di sviluppo a lungo termine (LTAD) questa è l’età d’oro per imparare la tecnica e la coordinazione e costruire la base aerobica. Fare anche altri sport (nuoto, corsa, bici, giochi) ti rende un atleta più completo.'],['Forza a corpo libero','Core, piegamenti, trazioni assistite, squat, elastici e mobilità di spalle. Movimenti perfetti prima di aggiungere carico.'],['Il recupero è allenamento','Il corpo migliora mentre riposa. Dormi 9-11 ore, mangia entro un’ora dall’allenamento, bevi, e almeno un giorno di riposo completo a settimana.'],['Ascolta il corpo','Segna sempre fatica e sensazioni. Dolore alle spalle o ai polsi che non passa? Dillo subito all’allenatrice: fermarsi 3 giorni è meglio che 3 settimane.'],['Gara: ritmo e testa','Riscaldamento di 20-30 minuti con qualche partenza. Nei 200 si parte forte e si tiene; nei 500 conta distribuire bene lo sforzo. Segna il passaggio a metà gara per capire dove migliorare.'],['Costanza, divertimento, pazienza','I campioni si costruiscono in anni, non in settimane. Divertiti, allenati con regolarità e confrontati con te stesso: il tuo avversario è il tuo tempo di ieri.']];
 pushPage({title:'Come migliorare',body:()=>`<div class="card how" style="font-size:14px;color:var(--sec)">Principi usati dagli allenatori di canoa velocità e dalla scienza dello sport moderna, adattati a un atleta di 12 anni. Le indicazioni della tua allenatrice vengono sempre prima.</div><div class="card" style="padding:4px 16px">${P.map((x,i)=>`<div class="pr"><div class="n">${i+1}</div><div><b>${x[0]}</b><span>${x[1]}</span></div></div>`).join('')}</div>`})}
function rpeGuide(){pushPage({title:'Scala di fatica',body:()=>`<div class="card how"><p>Alla fine dell’allenamento chiediti: <b>quanto è stato duro, nel complesso?</b></p></div><div class="list">${[[1,'Riposo attivo, passeggiata in barca'],[3,'Facile: respiri bene e parli tranquillo'],[5,'Medio: parli solo a frasi corte'],[7,'Duro: riesci a dire solo poche parole'],[9,'Durissimo: non riesci a parlare'],[10,'Massimo assoluto, come il finale di una gara']].map(([n,t])=>`<div class="row"><div class="ic" style="background:${rpeCol(n)};color:#fff;font-weight:800">${n}</div><div class="m"><div class="t" style="white-space:normal">${t}</div></div></div>`).join('')}</div><div class="card how"><p>L’app moltiplica fatica × minuti per calcolare il <b>carico</b>: così capisce se ti stai allenando troppo, troppo poco o nel modo giusto.</p></div>`})}

const IDBK={p:null,db(){if(this.p)return this.p;this.p=new Promise(res=>{try{if(!window.indexedDB)return res(null);const q=indexedDB.open('pagaia_db',1);q.onupgradeneeded=()=>{try{q.result.createObjectStore('kv')}catch(e){}};q.onsuccess=()=>res(q.result);q.onerror=()=>res(null);q.onblocked=()=>res(null);setTimeout(()=>res(null),4000)}catch(e){res(null)}});return this.p},
 async get(){const d=await this.db();if(!d)return null;return new Promise(res=>{try{const r=d.transaction('kv','readonly').objectStore('kv').get(KEY);r.onsuccess=()=>res(r.result||null);r.onerror=()=>res(null)}catch(e){res(null)}})},
 async set(v){const d=await this.db();if(!d)return false;return new Promise(res=>{try{const t=d.transaction('kv','readwrite');t.objectStore('kv').put(v,KEY);t.oncomplete=()=>res(true);t.onerror=()=>res(false);t.onabort=()=>res(false)}catch(e){res(false)}})}};

async function pdfLines(buf){const L=await getPdf();const doc=await L.getDocument({data:buf,isEvalSupported:false}).promise;const out=[];for(let p=1;p<=doc.numPages;p++){const pg=await doc.getPage(p);const tc=await pg.getTextContent();const rows={};tc.items.forEach(it=>{if(!it.str||!it.str.trim())return;const y=Math.round(it.transform[5]/3);(rows[y]=rows[y]||[]).push({x:it.transform[4],s:it.str,w:it.width||0})});Object.keys(rows).map(Number).sort((a,b)=>b-a).forEach(y=>{const r=rows[y].sort((a,b)=>a.x-b.x);let line='',lx=null;r.forEach(o=>{if(lx!=null){const gap=o.x-lx;line+=gap>12?'    ':gap>1?' ':''}line+=o.s;lx=o.x+o.w});out.push(line)})}return out}
const TIME_RE=/(?:^|\s)(\d{1,2})['’:](\d{2})(?:["”.,](\d{1,2}))(?=\s|$)|(?:^|\s)(\d{2})[.,](\d{2})(?=\s|$)/;

function lineHead(l){if(/staffetta/i.test(l)){const m=l.match(/(\d)\s*x\s*(\d{3})/i);return{barca:'Staffetta',dist:m?+m[1]*+m[2]:800}}const m=l.match(/\b([KC])\s?([124])(?:[\s-]*(\d)[.,]?(\d{2}))?\b[^\n]*?\b(\d{3,4}|\d\.\d{3})\s?(?:m\b|m\.|metri)/i);if(!m)return null;return{barca:(m[1]+m[2]).toUpperCase(),dist:+String(m[5]).replace('.','')}}
const lineTurno=l=>{const t=l.toLowerCase();return /finale diretta/.test(t)?'Finale diretta':/semifinal/.test(t)?'Semifinale':/finale\s*b\b/.test(t)?'Finale B':/finale/.test(t)?'Finale':/batteri/.test(t)?'Batteria':/serie/.test(t)?'Serie':''};

 lines=lines.map(l=>String(l||'').replace(/\s+$/,''));const U=lines.map(l=>l.toUpperCase());const MES={gennaio:1,febbraio:2,marzo:3,aprile:4,maggio:5,giugno:6,luglio:7,agosto:8,settembre:9,ottobre:10,novembre:11,dicembre:12};
 let date=null,luogo='',title='';for(const l of lines.slice(0,40)){let m=l.match(/(\d{1,2})[\/.\-](\d{1,2})[\/.\-](20\d\d)/);if(m){date=`${m[3]}-${pad2(m[2])}-${pad2(m[1])}`}else{m=l.toLowerCase().match(/(\d{1,2})\s+(gennaio|febbraio|marzo|aprile|maggio|giugno|luglio|agosto|settembre|ottobre|novembre|dicembre)\s+(20\d\d)/);if(m)date=`${m[3]}-${pad2(MES[m[2]])}-${pad2(m[1])}`}if(date){luogo=l.replace(/.*(20\d\d)/,'').trim().split(/\s{3,}/).pop()||'';break}}

 const found=[];U.forEach((l,i)=>{if(!l.includes(sur))return;let hi=-1;for(let j=i;j>=0&&j>i-80;j--){if(isHead(lines[j])){hi=j;break}}

 return{date,luogo,title,found}}

async function getOcr(prog){if(ocrW)return ocrW;prog&&prog('Preparo il lettore di foto (solo la prima volta)…');await loadScript(TJS+'tesseract.min.js');

async function fileToCanvas(file){const url=URL.createObjectURL(file);try{const im=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});const sc=Math.min(1,2400/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);c.getContext('2d').drawImage(im,0,0,c.width,c.height);return c}finally{URL.revokeObjectURL(url)}}

document.addEventListener('click',e=>{const t=e.target.closest('[data-clr],[data-tab],[data-exp],.chart [data-i],[data-a],[data-k]');if(!t)return;
 if(t.hasAttribute('data-clr')){const i=t.previousElementSibling;i.value='';i.dispatchEvent(new Event('input',{bubbles:true}));i.focus();return}
 if(t.dataset.tab){if(t.dataset.tab===TAB&&!STACK.length){const sc=$('#view .scroll');sc&&sc.scrollTo({top:0,behavior:'smooth'});return}go(t.dataset.tab);return}
 if(t.dataset.exp){e.stopPropagation();openZoom(t.dataset.exp);return}
 if(t.dataset.i!=null&&t.closest('.chart')&&!t.dataset.a){e.stopPropagation();showTip(t);return}
 if(t.dataset.a){ACT[t.dataset.a]&&ACT[t.dataset.a](t);return}
 if(t.dataset.k)openDetail(t.dataset.k)});
let lastW=innerWidth;window.addEventListener('resize',()=>{if(Math.abs(innerWidth-lastW)<2)return;lastW=innerWidth;clearTimeout(window._rz);window._rz=setTimeout(()=>{renderTab()},200)});
/* ---------- ALTEZZA STABILE (la barra dei tab resta sempre al suo posto) ---------- */
function fitH(){try{const h=window.innerHeight||document.documentElement.clientHeight;if(h>200)document.documentElement.style.setProperty('--app-h',h+'px');if(window.scrollX||window.scrollY)window.scrollTo(0,0);document.documentElement.scrollTop=0;document.body.scrollTop=0}catch(e){}}
['resize','orientationchange','pageshow','focus'].forEach(ev=>window.addEventListener(ev,()=>{fitH();setTimeout(fitH,250)}));
document.addEventListener('visibilitychange',()=>{if(!document.hidden){fitH();setTimeout(fitH,300);setTimeout(fitH,1000)}});
document.addEventListener('focusout',()=>setTimeout(fitH,120));
window.addEventListener('scroll',()=>{if(window.scrollY)window.scrollTo(0,0)},{passive:true});
setInterval(()=>{try{const r=document.getElementById('tabbar').getBoundingClientRect();if(r.bottom>innerHeight+2||r.top<0||r.height<10)fitH()}catch(e){}},1500);
fitH();
renderTab(true);
bootMemory();
</script>
